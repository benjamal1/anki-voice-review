[project]
name = "anki-voice-review"
version = "0.1.0"
description = "Hands-free voice review for Anki. Mac-only, fully local."
requires-python = ">=3.11"
# No runtime dependencies. urllib, difflib, html.parser, and subprocess cover everything;
# whisper.cpp, say, Anki, and Ollama are all external processes reached over stdio or HTTP.
dependencies = []

[project.scripts]
avr = "avr.cli:main"

[dependency-groups]
dev = [
    "pyqt6>=6.11.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["avr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
